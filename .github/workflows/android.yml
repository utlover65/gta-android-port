name: Build Astra Dawn WebGPU APK

on:
  workflow_dispatch:
    inputs:
      native_engine:
        description: "Build experimental native Wasmtime engine test (not yet playable)"
        required: false
        type: boolean
        default: false
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install host build tools
        shell: bash
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build protobuf-compiler pkg-config
          protoc --version

      - name: Locate Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail

      - name: Install Android packages
        shell: bash
        run: |
          set -eux
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"
          test -d "$ANDROID_HOME/ndk/27.2.12479018"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Checkout Dawn
        shell: bash
        run: |
          set -eux
          git clone --depth 1 https://github.com/google/dawn.git dawn-source
          git -C dawn-source rev-parse --short HEAD

      - name: Configure Dawn for Android ARM64
        shell: bash
        run: |
          set -eux
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          NDK="$SDK/ndk/27.2.12479018"
          PROTOC="$(command -v protoc)"
          test -f "$NDK/build/cmake/android.toolchain.cmake"

          cmake -S dawn-source -B dawn-build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DPROTOC_EXECUTABLE="$PROTOC" \
            -DDAWN_FETCH_DEPENDENCIES=ON \
            -DDAWN_ENABLE_INSTALL=ON \
            -DDAWN_ENABLE_VULKAN=ON \
            -DDAWN_ENABLE_OPENGLES=OFF \
            -DDAWN_ENABLE_DESKTOP_GL=OFF \
            -DDAWN_ENABLE_SWIFTSHADER=OFF \
            -DDAWN_ENABLE_SPIRV_VALIDATION=OFF \
            -DDAWN_BUILD_SAMPLES=OFF \
            -DDAWN_BUILD_TESTS=OFF \
            -DDAWN_BUILD_MONOLITHIC_LIBRARY=SHARED \
            -DTINT_BUILD_TESTS=OFF \
            -DTINT_BUILD_CMD_TOOLS=OFF

      - name: Build Dawn WebGPU library
        run: cmake --build dawn-build --target webgpu_dawn --parallel 2

      - name: Stage Dawn native library and WebGPU header
        shell: bash
        run: |
          set -eux
          LIB="dawn-build/src/dawn/native/libwebgpu_dawn.so"
          test -f "$LIB"

          HEADER="dawn-source/third_party/webgpu-headers/src/webgpu.h"
          if [ ! -f "$HEADER" ]; then
            HEADER="$(find dawn-source/third_party/webgpu-headers -type f -name webgpu.h -print -quit)"
          fi
          if [ ! -f "$HEADER" ]; then
            echo "Could not locate Dawn's webgpu-headers dependency webgpu.h"
            find dawn-source/third_party -maxdepth 5 -iname '*webgpu*' -print | head -100
            exit 1
          fi

          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/cpp/include/webgpu
          cp "$LIB" app/src/main/jniLibs/arm64-v8a/libwebgpu_dawn.so
          cp "$HEADER" app/src/main/cpp/include/webgpu/webgpu.h
          file app/src/main/jniLibs/arm64-v8a/libwebgpu_dawn.so
          ls -lh app/src/main/jniLibs/arm64-v8a/libwebgpu_dawn.so app/src/main/cpp/include/webgpu/webgpu.h

      - name: Stage pinned Wasmtime Android ARM64 runtime
        if: ${{ inputs.native_engine == true }}
        shell: bash
        run: |
          set -euxo pipefail
          ARCHIVE="$RUNNER_TEMP/wasmtime-v49.0.2-aarch64-android-c-api.tar.xz"
          URL="https://github.com/bytecodealliance/wasmtime/releases/download/v49.0.2/wasmtime-v49.0.2-aarch64-android-c-api.tar.xz"
          curl -fL --retry 3 --retry-delay 2 "$URL" -o "$ARCHIVE"
          echo "7d0fcac9a3533df910edfd0651990ba17161827485120d026f25859cf77df045  $ARCHIVE" | sha256sum -c -
          EXTRACT="$RUNNER_TEMP/wasmtime-android-c-api"
          mkdir -p "$EXTRACT"
          tar -xJf "$ARCHIVE" -C "$EXTRACT"
          LIB="$(find "$EXTRACT" -type f -name libwasmtime.so -print -quit)"
          HEADER="$(find "$EXTRACT" -type f -name wasmtime.h -print -quit)"
          test -n "$LIB" && test -s "$LIB"
          test -n "$HEADER" && test -s "$HEADER"
          INCLUDE="$(dirname "$HEADER")"
          test -f "$INCLUDE/wasmtime/conf.h"
          if ! grep -q '^#define WASMTIME_FEATURE_THREADS' "$INCLUDE/wasmtime/conf.h"; then
            echo "This Wasmtime C API artifact was built without shared-memory/thread support required by game.wasm."
            exit 1
          fi
          if ! grep -q '^#define WASMTIME_FEATURE_COMPILER' "$INCLUDE/wasmtime/conf.h"; then
            echo "This Wasmtime C API artifact does not expose the module compiler API required by this host."
            exit 1
          fi
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/cpp/wasmtime-include app/src/main/assets/licenses
          cp "$LIB" app/src/main/jniLibs/arm64-v8a/libwasmtime.so
          cp -R "$INCLUDE/." app/src/main/cpp/wasmtime-include/
          curl -fL --retry 3 --retry-delay 2             "https://raw.githubusercontent.com/bytecodealliance/wasmtime/v49.0.2/LICENSE"             -o app/src/main/assets/licenses/wasmtime-LICENSE.txt
          file app/src/main/jniLibs/arm64-v8a/libwasmtime.so
          ls -lh app/src/main/jniLibs/arm64-v8a/libwasmtime.so app/src/main/cpp/wasmtime-include/wasmtime.h app/src/main/assets/licenses/wasmtime-LICENSE.txt

      - name: Build installable debug APK
        shell: bash
        run: |
          set -euxo pipefail
          if [ "${{ inputs.native_engine }}" = "true" ]; then
            gradle --no-daemon -PnativeEngine=true assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Verify APK exists
        shell: bash
        run: |
          set -eux
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          file "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -20

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.native_engine == true && 'gta-native-engine-debug-apk' || 'astra-dawn-webgpu-debug-apk' }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
